<button id="theme-toggle" type="button"

  hx-get="partials/toggle-to-light.html" hx-swap="outerHTML"
  data-apply-theme="dark"
  aria-label="Switch to dark theme">
  <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
